name: Build e deploy no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Toda segunda-feira: as páginas são geradas no build, então durações ("11 meses")
  # e anos de experiência só se atualizam com um build novo
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Necessário para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um novo push cancela o build anterior que ainda não publicou
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test -- --watch=false

      # Gera as páginas de cada idioma já prontas e, em seguida, index.html e 404.html (scripts/pages-fallback.mjs)
      - name: Build de produção
        run: npm run build:pages

      - name: Enviar artefato do Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          # builder "application" (Angular 17+) gera os arquivos do navegador em browser/
          path: dist/curriculum/browser

  deploy:
    name: Deploy
    # Pull requests só validam o build; publica apenas na main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
