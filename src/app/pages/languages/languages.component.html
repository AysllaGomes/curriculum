<div class="card">
    <h3 class="card-title">{{ labels.languages.title }}</h3>

    <ul class="list">
        @for (lang of languages; track lang.name) {
            <li class="language-item">
                <div class="language-info">
                    <strong class="language-name">{{ lang.name }}</strong>
                    <span class="language-level muted">{{ lang.nameLevel }} ({{ lang.level }})</span>
                </div>
                <div class="bars" aria-hidden="true">
                    @for (filled of lang.bars; track $index) {
                        <span class="bar" [class.filled]="filled"></span>
                    }
                </div>
            </li>
        }
    </ul>
</div>
