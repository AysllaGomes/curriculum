<section id="topo" class="hero container">
    <div class="text">
        <p class="badge">
            <span class="badge-dot" aria-hidden="true"></span>
            {{ badge }}
        </p>
        <h1>{{ profile.shortName }}</h1>
        <p class="headline">{{ headline }}</p>
        <!-- Só no papel/PDF: o contato vai no topo, com os endereços escritos -->
        <p class="contact-line print-only">
            <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
            · <a [href]="profile.links.linkedin">{{ linkedin }}</a>
            · <a [href]="profile.links.github">{{ github }}</a>
            · {{ profile.city }}
        </p>
        <div class="actions no-print">
            <a class="btn btn-primary" [href]="page + '#contato'">{{ labels.hero.contact }}</a>
            <a class="btn" [href]="page + '#projetos'">{{ labels.hero.projects }}</a>
            <a class="btn btn-cv" [href]="cv" [attr.download]="labels.hero.cvFile" type="application/pdf"
               (click)="trackCv()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
                {{ labels.hero.cv }}
            </a>
        </div>
    </div>

    <div class="photo-wrap" [class.no-print]="!printPhoto">
        <img class="photo" [ngSrc]="profile.photoUrl" width="400" height="400" priority
             [alt]="labels.hero.photoAlt + ' ' + profile.name">
    </div>
</section>
