<section id="competencias" class="container section">
    <h2 class="section-title">{{ labels.skills.title }}</h2>

    <div class="groups">
        @for (group of skillGroups; track group.title) {
            <div class="group">
                <h3 class="group-title">{{ group.title }}</h3>
                <ul class="skills">
                    @for (skill of group.skills; track skill) {
                        <li class="chip">{{ skill }}</li>
                    }
                </ul>
            </div>
        }
    </div>
</section>
