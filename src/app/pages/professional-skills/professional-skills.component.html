<h5 class="section-title">{{ professionalSkills }}</h5>

<hr>

  <ul class="skill-groups">
    @for (skillGroup of skillGroups; track skillGroup) {
      <li class="skill-group">
        <p class="group-title">{{ skillGroup.title }}</p>
        <ul class="skills">
          @for (skill of skillGroup.skills; track skill) {
            <li class="skill">{{ skill }}</li>
          }
        </ul>
      </li>
    }
  </ul>
