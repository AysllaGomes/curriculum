<div class="card">
    <h3 class="card-title">{{ labels.education.degree }}</h3>

    <ul class="education-list">
        @for (education of academicEducations; track education.course) {
            <li class="education-item">
                <strong class="education-course">{{ education.course }}</strong>
                <span class="education-institution muted">{{ education.institution }}</span>
                <span class="education-institution muted">{{ education.period }}</span>
                @if (education.url) {
                    <a [href]="education.url" target="_blank" rel="noopener noreferrer">
                        {{ education.course }} <span class="visually-hidden">{{ labels.newTab }}</span>
                    </a>
                }
            </li>
        }
    </ul>

    <app-pages-specialization></app-pages-specialization>
</div>
